{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Eliminar incidencia</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-warning">
                        <strong>¿Está seguro de eliminar esta incidencia?</strong>
                        <p class="mb-0 mt-2">Esta acción no se puede deshacer.</p>
                    </div>
                    <div class="mb-4">
                        <p class="mb-1"><strong>Incidencia:</strong></p>
                        <h5>{{ object.title }}</h5>
                        <p class="text-muted mb-0">Zona: {{ object.zone }}</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'incidents:incidencia_list' %}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
