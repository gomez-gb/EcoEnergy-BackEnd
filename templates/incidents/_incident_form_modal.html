<div class="modal fade" id="incidenciaModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">
                        {% if object %} Editar incidencia {% else %} Nueva incidencia {% endif %}
                    </h5>
                </div>
                <div class="modal-body">
                    {{ form.non_field_errors }}
                    {% for field in form %}
                    <div class="mb-3">
                        {{ field.label_tag }}
                        {{ field }}
                        {% for error in field.errors %}
                        <div class="text-danger">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}
                </div>
                <div class="modal-footer">
                    <a href="{% url 'incidents:incident_list' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% if open_modal %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const modal = new bootstrap.Modal(document.getElementById("incidenciaModal"));
        modal.show();
    });
</script>
{% endif %}
