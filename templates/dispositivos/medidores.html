{% extends "base.html" %}

{% block title %}Medidores | EcoEnergy{% endblock %}

{% block content %}
    <h1>Medidores</h1>
    <ul>
        {% for medidor in medidores %}
            <li>{{ medidor.nombre }} — {{ medidor.estado }}</li>
        {% empty %}
            li>No existen Medidores disponibles.</li>
        {% endfor %}
    </ul>
{% endblock %}
