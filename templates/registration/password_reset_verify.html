{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card mt-5">
                <div class="card-body">
                    <h1 class="h3 mb-3 text-center">Ingresa el código</h1>
                    <p class="text-muted text-center">
                        Revisa tu correo e ingresa el código de 6 dígitos (vence en {{ ttl_seconds }} segundos).
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        {% bootstrap_form form %}
                        <button class="btn btn-primary w-100 mt-2" type="submit">
                            Verificar código
                        </button>
                    </form>
                    <p class="text-center mt-3">
                        <a href="{% url 'accounts:password_reset_request' %}">Solicitar un código nuevo</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
